services:
  redis:
    image: redis:7-alpine
    container_name: static_analysis_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  app:
    build: .
    container_name: static_analysis_engine
    depends_on:
      - redis
    env_file:
      - .env
    volumes:
      - .:/app
      - ./test_samples:/test_samples

volumes:
  redis_data: