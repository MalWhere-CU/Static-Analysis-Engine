version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: static_analysis_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  app:
    build: .
    container_name: static_analysis_engine
    depends_on:
      - redis
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis  # Binds python transparently to the container alias
    volumes:
      - .:/app
      - ./samples:/samples # Directory containing malicious binaries for processing

volumes:
  redis_data: